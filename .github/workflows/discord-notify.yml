name: Discord GitHub Notifications

# Broadcasts repo activity to Discord.
# NOTE: actions/github-script@v7 runs plain JavaScript — no TypeScript syntax allowed.
# Required secret: DISCORD_WEBHOOK_URL (Discord channel → Integrations → Webhooks → Copy URL)
on:
  watch:
    types: [started]
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post event to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const AVATAR =
              'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const repoLabel = `[${context.repo.owner}/${context.repo.repo}](${repoUrl})`;
            const actor = context.actor;

            let content = null;

            if (context.eventName === 'watch') {
              content = `⭐ **${actor}** starred ${repoLabel}`;
            } else if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              const emoji = context.payload.action === 'opened' ? '🐛 **Issue opened**' : '✅ **Issue closed**';
              content = `${emoji} in ${repoLabel} by **${actor}**: #${issue.number} ${issue.title} (${issue.html_url})`;
            } else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const label = `#${pr.number} ${pr.title} (${pr.html_url})`;
              if (context.payload.action === 'opened') {
                content = `🔀 **PR opened** in ${repoLabel} by **${actor}**: ${label}`;
              } else if (pr.merged === true) {
                content = `🎉 **PR merged** in ${repoLabel} by **${actor}**: ${label}`;
              } else {
                content = `🚫 **PR closed (not merged)** in ${repoLabel} by **${actor}**: ${label}`;
              }
            }

            if (!content) {
              core.info(`No Discord message for event '${context.eventName}'/${context.payload.action}`);
              return;
            }

            const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'Captain Hook',
                avatar_url: AVATAR,
                content,
              }),
            });

            if (!res.ok) {
              core.setFailed(`Discord webhook returned ${res.status}: ${await res.text()}`);
            } else {
              core.info(`Posted to Discord: ${content}`);
            }
